[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-metadata-forensics"
version = "0.1.0"
description = "Image metadata, privacy and forensic analysis toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=11.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
heif = [
    "pillow-heif>=1.7,<2",
]

raw = [
    "rawpy>=0.27,<0.28",
]


[project.scripts]
photometa = "photometa.cli:main"

[tool.setuptools.packages.find]
include = ["photometa*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

