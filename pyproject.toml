[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-metadata-forensics"
version = "0.1.0"
description = "Image metadata, privacy and forensic analysis toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=11.0",
]

[project.optional-dependencies]
heif = [
    "pillow-heif>=1.7,<2",
]

[project.scripts]
photometa = "photometa.cli:main"

[tool.setuptools.packages.find]
include = ["photometa*"]
