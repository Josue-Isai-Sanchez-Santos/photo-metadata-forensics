name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  tests:

    name: Tests - Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.11"
          - "3.14"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade packaging tools
        run: |
          python -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel

      - name: Install PhotoMeta
        run: |
          python -m pip install \
            -e ".[heif,raw]"

      - name: Check installed dependencies
        run: |
          python -m pip check

      - name: Compile Python sources
        run: |
          python -m compileall \
            -q \
            photometa \
            tests \
            tools

      - name: Run test suite
        run: |
          python -m unittest discover \
            -s tests \
            -v


  quality:

    name: Lint and Security

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade packaging tools
        run: |
          python -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel

      - name: Install PhotoMeta
        run: |
          python -m pip install \
            -e ".[heif,raw]"

      - name: Install CI tools
        run: |
          python -m pip install \
            ruff \
            bandit \
            pip-audit

      - name: Ruff
        run: |
          ruff check \
            photometa \
            tests \
            tools

      - name: Bandit
        run: |
          bandit \
            -r photometa tools \
            -ll

      - name: Audit project dependencies
        run: |
          pip-audit .

      - name: Check installed dependencies
        run: |
          python -m pip check
